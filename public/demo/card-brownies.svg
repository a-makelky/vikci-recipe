<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title">
  <title>Brownies recipe card placeholder</title>
  <rect width="960" height="720" fill="#f1dfc4" />
  <rect x="54" y="54" width="852" height="612" rx="28" fill="#fffaf0" stroke="#d7b98f" stroke-width="12" />
  <text x="128" y="166" fill="#6b3a22" font-family="Georgia, serif" font-size="54">Fudgy Brownies</text>
  <text x="128" y="242" fill="#6f5a4d" font-family="Georgia, serif" font-size="34">1/2 cup butter</text>
  <text x="128" y="292" fill="#6f5a4d" font-family="Georgia, serif" font-size="34">1 cup sugar</text>
  <text x="128" y="342" fill="#6f5a4d" font-family="Georgia, serif" font-size="34">2 eggs</text>
  <text x="128" y="392" fill="#6f5a4d" font-family="Georgia, serif" font-size="34">1/3 cup cocoa</text>
  <text x="128" y="470" fill="#8e5f44" font-family="'Bradley Hand', cursive" font-size="42">Bake until the middle just sets.</text>
</svg>
